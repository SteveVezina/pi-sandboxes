[package]
name = "pi-sandbox-gui"
version = "0.1.0"
description = "Cross-platform desktop workbench for PI Agent Sandbox Runtime"
authors = ["PI Sandbox"]
edition = "2021"

[lib]
name = "pi_sandbox_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
